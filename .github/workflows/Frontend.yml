name: Frontend CI/CD

on:
  push:
    branches:
      - feature
    paths:
      - SalesApp.Client/**

jobs:
  frontend:
    name: Test, Build & Publish Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: SalesApp.Client
        run: npm install

      - name: Run frontend tests
        working-directory: SalesApp.Client
        run: npm run test:coverage -- --watch=false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.KEY_M11_CI_CD }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: SalesApp.Client
          file: SalesApp.Client/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mdeis-m11-ga-ci-cd-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mdeis-m11-ga-ci-cd-frontend:${{ github.sha }}
