name: CI/CD SalesApp

on:
  push:
    branches: ["feature", "main"]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SalesApp.Api/SalesApp.Api.csproj

      - name: Run Tests
        run: dotnet test --no-build --verbosity normal

    outputs:
      tests-passed: ${{ steps.tests.outcome }}

  build-and-push:
    needs: test-backend
    if: needs.test-backend.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.KEY_M11_CI_CD }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_API_URL=http://localhost:8080
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mdeis-m11-ga-ci-cd:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mdeis-m11-ga-ci-cd:${{ github.sha }}
